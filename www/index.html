<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Signals</title>
<style>
:root{--bg:#0e1320;--card:#171e30;--bd:#27314a;--tx:#e8ecf6;--mu:#8a96b5;
--buy:#38e08c;--sell:#ff6b7d;--en:#ffd45e;--tp1:#5cc8ff;--tp2:#c79bff;--sl:#ff9f5a;--xau:#ffd45e;--btc:#ff9f43}
[data-theme=light]{--bg:#f3f1ec;--card:#fffdf8;--bd:#e0dbcf;--tx:#1d2233;--mu:#6b7186;
--buy:#0f8f4f;--sell:#d1334a;--en:#a86b00;--tp1:#0a6fb8;--tp2:#7a3fd1;--sl:#c2540a;--xau:#a86b00;--btc:#c2540a}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
h1{font-size:22px;font-weight:700;letter-spacing:-.3px}
.btns button{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;font-size:14px;margin-left:6px}
#status{padding:0 16px 8px;color:var(--mu);font-size:13px}
#status b{color:var(--en)}
main{flex:1;overflow-y:auto;padding:4px 14px 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:13px 14px;margin-bottom:12px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.pair{font-weight:700;font-size:17px}
.pair.XAUUSD{color:var(--xau)}.pair.BTCUSD{color:var(--btc)}
.side{font-weight:700;font-size:13px;padding:3px 10px;border-radius:20px;margin-left:8px}
.side.BUY{background:color-mix(in srgb,var(--buy) 18%,transparent);color:var(--buy)}
.side.SELL{background:color-mix(in srgb,var(--sell) 18%,transparent);color:var(--sell)}
.time{color:var(--mu);font-size:12.5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.cell small{display:block;color:var(--mu);font-size:12px}
.cell span{font-size:17px;font-weight:650;font-variant-numeric:tabular-nums}
.en span{color:var(--en)}.t1 span{color:var(--tp1)}.t2 span{color:var(--tp2)}.sl span{color:var(--sl)}
.fresh{display:inline-block;margin-left:8px;font-size:11.5px;color:var(--bg);background:var(--tp1);padding:1px 7px;border-radius:8px;font-weight:700}
.empty{color:var(--mu);text-align:center;padding:40px 10px}
nav{display:flex;border-top:1px solid var(--bd);background:var(--card);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:14px 4px;font-size:14px;font-weight:600}
nav button.on{color:var(--tx);box-shadow:inset 0 -3px 0 var(--en)}
nav button[data-t=XAUUSD].on{color:var(--xau)}nav button[data-t=CRYPTO].on{color:var(--btc)}nav button[data-t=NEW].on{color:var(--tp1)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px}.chips button{flex:none;background:var(--card);color:var(--mu);border:1px solid var(--bd);border-radius:18px;padding:5px 12px;font-size:13px}.chips button.on{color:var(--bg);background:var(--tp2);border-color:var(--tp2)}.src{color:var(--mu);font-size:11.5px;margin-top:8px}
</style>
</head>
<body>
<header><h1>Signals</h1><div class="btns"><button id="rf">Refresh</button><button id="th">Light</button></div></header>
<div id="status">Loading...</div>
<main id="list"></main>
<nav>
<button data-t="XAUUSD" class="on">XAUUSD signal</button>
<button data-t="CRYPTO">Crypto signal</button>
<button data-t="NEW">New signal</button>
</nav>
<script src="config.js"></script>
<script src="strategy.js"></script>
<script>
const S=window.Strategy,PAIRS=S.PAIRS,KEYS=Object.keys(PAIRS),CR=KEYS.filter(p=>p!=='XAUUSD');
let tab='XAUUSD',cf='ALL',store={},price={},errs={};KEYS.forEach(p=>store[p]=[]);
const $=id=>document.getElementById(id);

function load(){try{const s=JSON.parse(localStorage.getItem('sigs2'));if(s)KEYS.forEach(p=>store[p]=s[p]||[])}catch(e){}
 const t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t;syncBtn()}
function save(){try{localStorage.setItem('sigs2',JSON.stringify(store))}catch(e){}}
function syncBtn(){$('th').textContent=document.documentElement.dataset.theme==='dark'?'Light':'Dark'}
function merge(p,sg){const m=new Map(store[p].map(x=>[x.id,x]));sg.forEach(x=>m.set(x.id,x));store[p]=[...m.values()].sort((a,b)=>b.time-a.time).slice(0,40)}
const total=()=>KEYS.reduce((n,p)=>n+store[p].length,0);

async function fromServer(){
 if(!window.SIGNALS_URL||SIGNALS_URL.includes('PLACEHOLDER'))return false;
 try{const r=await fetch(SIGNALS_URL+'?t='+Date.now());if(!r.ok)return false;const j=await r.json();
  KEYS.forEach(p=>{if(j[p])merge(p,j[p])});return true}catch(e){return false}}

async function refreshLocal(){
 $('status').textContent='Updating from Binance...';
 await Promise.all(KEYS.map(async p=>{try{
  const [k,k1]=await Promise.all([S.klines(PAIRS[p],'15m',500),S.klines(PAIRS[p],'1h',500)]);
  price[p]=k[k.length-1][4];merge(p,S.signals(p,k,k1));errs[p]=null}catch(e){errs[p]=e.message}}));
 save();
 const bad=KEYS.filter(p=>errs[p]);
 $('status').innerHTML=(price.XAUUSD?`XAUUSD <b>${price.XAUUSD}</b> | `:'')+(price.BTCUSD?`BTCUSD <b>${price.BTCUSD}</b>`:'')+(bad.length?`<br>Could not load: ${bad.join(', ')}`:'');
 render();
}
async function refresh(){
 const ok=await fromServer();
 if(ok){save();render();$('status').innerHTML='Server signals <b>live</b>. Alerts come even when the app is closed.'}
 if(!ok||total()===0)await refreshLocal();
}
async function initPush(){
 const C=window.Capacitor;if(!C||!C.isNativePlatform||!C.isNativePlatform())return;
 const FM=C.Plugins&&C.Plugins.FirebaseMessaging;if(!FM)return;
 try{
  await FM.requestPermissions();
  await FM.createChannel({id:'signals',name:'Signals',importance:5,vibration:true});
  await FM.subscribeToTopic({topic:'signals'});
  FM.addListener('notificationReceived',()=>refresh());
  FM.addListener('notificationActionPerformed',()=>{tab='NEW';refresh()});
 }catch(e){}
}

function fmt(t){return new Date(t).toLocaleString([], {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}
function card(s,fresh){return `<div class="card"><div class="top"><div><span class="pair ${s.pair==='XAUUSD'?'XAUUSD':'BTCUSD'}">${s.pair}</span><span class="side ${s.side}">${s.side}</span>${fresh?'<span class="fresh">New</span>':''}</div><div class="time">${fmt(s.time)}</div></div>
<div class="grid"><div class="cell en"><small>Entry</small><span>${s.entry}</span></div><div class="cell sl"><small>SL</small><span>${s.sl}</span></div>
<div class="cell t1"><small>TP1</small><span>${s.tp1}</span></div><div class="cell t2"><small>TP2</small><span>${s.tp2}</span></div></div><div class="src">Data: ${s.src||'Binance'}</div></div>`}

function render(){
 const all=KEYS.flatMap(p=>store[p]).sort((a,b)=>b.time-a.time);
 let items,chips='';
 if(tab==='NEW')items=all.slice(0,2);
 else if(tab==='XAUUSD')items=store.XAUUSD;
 else{items=all.filter(s=>s.pair!=='XAUUSD'&&(cf==='ALL'||s.pair===cf));
  chips='<div class="chips">'+['ALL',...CR].map(p=>`<button data-c="${p}" class="${cf===p?'on':''}">${p==='ALL'?'All':p.replace('USD','')}</button>`).join('')+'</div>'}
 $('list').innerHTML=chips+(items.length?items.map((s,i)=>card(s,tab==='NEW'&&i===0)).join(''):'<div class="empty">No strong signal yet. Strict filters mean fewer, cleaner signals.</div>');
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
}
$('list').onclick=e=>{const c=e.target.dataset.c;if(c){cf=c;render()}};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
$('rf').onclick=refresh;
$('th').onclick=()=>{const r=document.documentElement,n=r.dataset.theme==='dark'?'light':'dark';r.dataset.theme=n;try{localStorage.setItem('theme',n)}catch(e){}syncBtn()};
load();render();refresh();initPush();setInterval(refresh,60000);
</script>
</body>
</html>
