name: Build APK
on:
  push:
    paths-ignore:
      - 'data/**'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install --legacy-peer-deps
      - name: Set signals URL
        run: sed -i "s#REPO_PLACEHOLDER#${{ github.repository }}#; s#BRANCH_PLACEHOLDER#${{ github.ref_name }}#" www/config.js
      - run: npx cap add android
      - name: Add google-services.json
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GSJ" > android/app/google-services.json
      - name: Allow notifications permission
        run: sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application#' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: signals-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
